<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    .terminal-bg {
      fill: #0B1017;
      stroke: #1D2938;
      stroke-width: 1;
      rx: 8;
    }
    .header-bg {
      fill: #121923;
      rx: 8;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      fill: #6B7280;
      letter-spacing: 0.5px;
    }
    .code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 13px;
      line-height: 1.5;
    }
    .prompt { fill: #5B9CFF; font-weight: 600; }
    .command { fill: #E2E8F0; font-weight: 500; }
    .output { fill: #8B95A7; font-weight: 400; }
    .cursor {
      fill: #5B9CFF;
      animation: blink 1s step-end infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Container -->
  <rect x="10" y="10" width="620" height="230" class="terminal-bg" filter="url(#shadow)" />
  
  <!-- Header -->
  <path d="M10 18 a8 8 0 0 1 8 -8 h 604 a8 8 0 0 1 8 8 v 20 h -620 z" class="header-bg" />
  <line x1="10" y1="38" x2="630" y2="38" stroke="#1D2938" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="30" cy="24" r="5" fill="#ED6A5E" />
  <circle cx="46" cy="24" r="5" fill="#F4BF4F" />
  <circle cx="62" cy="24" r="5" fill="#61C554" />

  <!-- Code Icon on right side -->
  <text x="600" y="28" class="text-title" text-anchor="middle">&lt;/&gt;</text>

  <!-- Title -->
  <text x="320" y="28" class="text-title" text-anchor="middle">resham@dev ~</text>

  <!-- Terminal Content -->
  <g class="code" transform="translate(30, 75)">
    <!-- Command 1 -->
    <text y="0">
      <tspan class="prompt">$ </tspan>
      <tspan class="command">whoami</tspan>
    </text>
    <text y="22" class="output">full-stack-software-engineer</text>

    <!-- Command 2 -->
    <text y="60">
      <tspan class="prompt">$ </tspan>
      <tspan class="command">focus</tspan>
    </text>
    <text y="82" class="output">APIs · backend · systems · cloud</text>

    <!-- Command 3 -->
    <text y="120">
      <tspan class="prompt">$ </tspan>
      <tspan class="command">status</tspan>
    </text>
    <text y="142" class="output">building... </text>
    
    <!-- Cursor █ -->
    <text x="98" y="142" class="cursor">█</text>
  </g>
</svg>
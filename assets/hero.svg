<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#141c2b" />
      <stop offset="100%" stop-color="#080B10" />
    </radialGradient>
    
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#202938" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>

    <!-- Typing Glow -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #F3F6FA;
      letter-spacing: 4px;
    }
    .title {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-weight: 400;
      font-size: 16px;
      fill: #8B95A7;
      letter-spacing: 1px;
    }
    .focus-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 12px;
      fill: #8B95A7;
      letter-spacing: 2px;
    }
    .dot {
      fill: #39D98A;
      animation: pulse 2s infinite;
    }
    .focus-text {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-weight: 600;
      font-size: 14px;
      fill: #5B9CFF;
      filter: url(#textGlow);
    }
    
    /* Animations */
    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
    @keyframes fadeCycle {
      0%, 15% { opacity: 1; transform: translateY(0); }
      20%, 95% { opacity: 0; transform: translateY(-5px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .t1 { animation: fadeCycle 12s infinite; animation-delay: 0s; }
    .t2 { animation: fadeCycle 12s infinite; animation-delay: 3s; opacity: 0; }
    .t3 { animation: fadeCycle 12s infinite; animation-delay: 6s; opacity: 0; }
    .t4 { animation: fadeCycle 12s infinite; animation-delay: 9s; opacity: 0; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#glow)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Main Content -->
  <g text-anchor="middle">
    <!-- Name -->
    <text x="400" y="90" class="name">RESHAM ROUT</text>
    
    <!-- Title -->
    <text x="400" y="125" class="title">Full-Stack Software Engineer</text>
    
    <!-- Focus Indicator -->
    <g transform="translate(400, 180)">
      <circle cx="-100" cy="-4" r="4" class="dot" />
      <text x="-85" y="0" class="focus-label" text-anchor="start">CURRENTLY BUILDING</text>
      
      <!-- Animated Text -->
      <text x="75" y="1" class="focus-text t1" text-anchor="start">Real-Time Systems</text>
      <text x="75" y="1" class="focus-text t2" text-anchor="start">Backend Architecture</text>
      <text x="75" y="1" class="focus-text t3" text-anchor="start">API &amp; Cloud Systems</text>
      <text x="75" y="1" class="focus-text t4" text-anchor="start">Scalable Products</text>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260">
  <defs>
    <radialGradient id="leftGlow" cx="15%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#2862FF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#2862FF" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="rightGlow" cx="85%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#9D4EDD" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#9D4EDD" stop-opacity="0" />
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .name-white {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #FFFFFF;
      letter-spacing: 2px;
    }
    .name-blue {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #8FAEF9;
      letter-spacing: 2px;
    }
    .title {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-weight: 400;
      font-size: 16px;
      fill: #8B95A7;
      letter-spacing: 0.5px;
    }
    .metadata {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-weight: 500;
      font-size: 10px;
      fill: #4b5563;
      letter-spacing: 1.5px;
    }
    .focus-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #6b7280;
      letter-spacing: 2px;
    }
    .focus-text {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-weight: 500;
      font-size: 15px;
      fill: #5B9CFF;
      filter: url(#glow);
    }
    .focus-bracket {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-weight: 500;
      font-size: 15px;
      fill: #3b5e9e;
    }
    .cursor-line {
      fill: #5B9CFF;
      font-size: 15px;
      font-weight: bold;
      animation: blink 1s step-end infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Bulletproof sequential animation with gaps to prevent overlap */
    @keyframes t1_anim {
      0% { opacity: 0; transform: translateY(-3px); }
      2% { opacity: 1; transform: translateY(0); }
      21% { opacity: 1; transform: translateY(0); }
      23% { opacity: 0; transform: translateY(-3px); }
      100% { opacity: 0; transform: translateY(-3px); }
    }
    @keyframes t2_anim {
      0% { opacity: 0; transform: translateY(-3px); }
      25% { opacity: 0; transform: translateY(-3px); }
      27% { opacity: 1; transform: translateY(0); }
      46% { opacity: 1; transform: translateY(0); }
      48% { opacity: 0; transform: translateY(-3px); }
      100% { opacity: 0; transform: translateY(-3px); }
    }
    @keyframes t3_anim {
      0% { opacity: 0; transform: translateY(-3px); }
      50% { opacity: 0; transform: translateY(-3px); }
      52% { opacity: 1; transform: translateY(0); }
      71% { opacity: 1; transform: translateY(0); }
      73% { opacity: 0; transform: translateY(-3px); }
      100% { opacity: 0; transform: translateY(-3px); }
    }
    @keyframes t4_anim {
      0% { opacity: 0; transform: translateY(-3px); }
      75% { opacity: 0; transform: translateY(-3px); }
      77% { opacity: 1; transform: translateY(0); }
      96% { opacity: 1; transform: translateY(0); }
      98% { opacity: 0; transform: translateY(-3px); }
      100% { opacity: 0; transform: translateY(-3px); }
    }
    
    .t1 { opacity: 0; animation: t1_anim 12s infinite; }
    .t2 { opacity: 0; animation: t2_anim 12s infinite; }
    .t3 { opacity: 0; animation: t3_anim 12s infinite; }
    .t4 { opacity: 0; animation: t4_anim 12s infinite; }
  </style>

  <rect width="100%" height="100%" fill="transparent" />
  
  <rect width="100%" height="100%" fill="url(#leftGlow)" />
  <rect width="100%" height="100%" fill="url(#rightGlow)" />

  <g transform="translate(100, 130)">
    <circle cx="0" cy="0" r="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" />
    <circle cx="0" cy="0" r="90" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" stroke-dasharray="4 8" />
    <circle cx="0" cy="0" r="60" fill="none" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1" />
    
    <path d="M 0 -130 L 0 -110 M 0 110 L 0 130 M -130 0 L -110 0 M 110 0 L 130 0" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
    <path d="M 64 -64 L 74 -74 M -64 64 L -74 74 M 64 64 L 74 74 M -64 -64 L -74 -74" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1" />
    
    <circle cx="-30" cy="-40" r="1.5" fill="#5B9CFF" filter="url(#glow)" />
    <circle cx="70" cy="-20" r="1" fill="#FFFFFF" opacity="0.5" />
    <circle cx="20" cy="80" r="1.5" fill="#5B9CFF" opacity="0.3" />
  </g>

  <g transform="translate(700, 130)">
    <circle cx="0" cy="0" r="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" />
    <circle cx="0" cy="0" r="90" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" stroke-dasharray="4 8" />
    <circle cx="0" cy="0" r="60" fill="none" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1" />
    
    <path d="M 0 -130 L 0 -110 M 0 110 L 0 130 M -130 0 L -110 0 M 110 0 L 130 0" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
    <path d="M 64 -64 L 74 -74 M -64 64 L -74 74 M 64 64 L 74 74 M -64 -64 L -74 -74" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1" />
    
    <circle cx="30" cy="40" r="1.5" fill="#D38CFF" filter="url(#glow)" />
    <circle cx="-60" cy="10" r="1" fill="#FFFFFF" opacity="0.5" />
    <circle cx="-10" cy="-70" r="1.5" fill="#D38CFF" opacity="0.3" />
  </g>

  <g text-anchor="middle">
    <g transform="translate(400, 45)">
      <circle cx="-75" cy="-3" r="3" fill="#39D98A" />
      <text x="-65" y="0" class="metadata" text-anchor="start">SYSTEM STATUS // ONLINE</text>
    </g>

    <text x="400" y="105" text-anchor="middle">
      <tspan class="name-white" dx="-6">RESHAM</tspan>
      <tspan class="name-blue" dx="6">ROUT</tspan>
    </text>
    <text x="400" y="140" class="title">Full-Stack Software Engineer</text>
    
    <g transform="translate(400, 195)">
      <circle cx="-75" cy="-4" r="3.5" fill="#39D98A" />
      <text x="-63" y="0" class="focus-label" text-anchor="start">CURRENTLY BUILDING</text>
      
      <g transform="translate(0, 28)">
        <text x="0" y="0" class="t1">
          <tspan class="focus-bracket">[ </tspan><tspan class="focus-text">Real-Time Systems</tspan><tspan class="focus-bracket"> ]</tspan><tspan class="cursor-line"> |</tspan>
        </text>
        <text x="0" y="0" class="t2">
          <tspan class="focus-bracket">[ </tspan><tspan class="focus-text">API &amp; Cloud Systems</tspan><tspan class="focus-bracket"> ]</tspan><tspan class="cursor-line"> |</tspan>
        </text>
        <text x="0" y="0" class="t3">
          <tspan class="focus-bracket">[ </tspan><tspan class="focus-text">Backend Architecture</tspan><tspan class="focus-bracket"> ]</tspan><tspan class="cursor-line"> |</tspan>
        </text>
        <text x="0" y="0" class="t4">
          <tspan class="focus-bracket">[ </tspan><tspan class="focus-text">Full-Stack Products</tspan><tspan class="focus-bracket"> ]</tspan><tspan class="cursor-line"> |</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
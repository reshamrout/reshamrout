<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080E" />
      <stop offset="50%" stop-color="#070B12" />
      <stop offset="100%" stop-color="#0A0F1A" />
    </linearGradient>

    <!-- Edge Glows -->
    <radialGradient id="leftGlow" cx="0%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2862FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#2862FF" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="rightGlow" cx="100%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#9D4EDD" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#9D4EDD" stop-opacity="0" />
    </radialGradient>

    <!-- Name Gradient -->
    <linearGradient id="routGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAF0FF" />
      <stop offset="50%" stop-color="#B3CAFF" />
      <stop offset="100%" stop-color="#A390FF" />
    </linearGradient>

    <!-- Grid Pattern & Mask -->
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#2B3A55" stroke-width="1" stroke-opacity="0.25" />
    </pattern>
    <radialGradient id="gridMaskGradient" cx="50%" cy="50%" r="75%">
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <mask id="gridMask">
      <rect width="1200" height="420" fill="url(#gridMaskGradient)" />
    </mask>

    <!-- Glowing Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .name-white {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-weight: 900;
      font-size: 80px;
      fill: #FFFFFF;
      letter-spacing: 4px;
    }
    .name-gradient {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-weight: 900;
      font-size: 80px;
      letter-spacing: 4px;
    }
    .title-mono {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
      font-weight: 500;
      font-size: 24px;
      fill: #8B95A7;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGradient)" />
  
  <!-- Subtle Grid -->
  <rect width="1200" height="420" fill="url(#gridPattern)" mask="url(#gridMask)" />

  <!-- Ambient Glows -->
  <rect width="1200" height="420" fill="url(#leftGlow)" />
  <rect width="1200" height="420" fill="url(#rightGlow)" />

  <!-- LEFT ORBITAL ARCS -->
  <g opacity="0.85">
    <circle cx="-50" cy="210" r="250" fill="none" stroke="#2862FF" stroke-width="1.5" stroke-opacity="0.2" />
    <circle cx="-50" cy="210" r="350" fill="none" stroke="#2862FF" stroke-width="1" stroke-dasharray="10 20" stroke-opacity="0.25" />
    <circle cx="-50" cy="210" r="450" fill="none" stroke="#2862FF" stroke-width="0.5" stroke-dasharray="2 12" stroke-opacity="0.4" />
    
    <!-- Moving Nodes -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 -50 210" to="360 -50 210" dur="40s" repeatCount="indefinite" />
      <circle cx="200" cy="210" r="4.5" fill="#2862FF" filter="url(#glow)"/>
      <circle cx="300" cy="210" r="2.5" fill="#2862FF" opacity="0.7"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 -50 210" to="0 -50 210" dur="50s" repeatCount="indefinite" />
      <circle cx="400" cy="210" r="3" fill="#2862FF" filter="url(#glow)"/>
      <circle cx="200" cy="210" r="2" fill="#FFFFFF" opacity="0.5"/>
    </g>
    
    <!-- Crosshairs -->
    <path d="M 200 205 L 200 215 M 195 210 L 205 210" stroke="#2862FF" stroke-width="1.5" stroke-opacity="0.6"/>
    <path d="M 300 205 L 300 215 M 295 210 L 305 210" stroke="#2862FF" stroke-width="1" stroke-opacity="0.5"/>
  </g>

  <!-- RIGHT ORBITAL ARCS -->
  <g opacity="0.85">
    <circle cx="1250" cy="210" r="250" fill="none" stroke="#9D4EDD" stroke-width="1.5" stroke-opacity="0.2" />
    <circle cx="1250" cy="210" r="350" fill="none" stroke="#9D4EDD" stroke-width="1" stroke-dasharray="10 20" stroke-opacity="0.25" />
    <circle cx="1250" cy="210" r="450" fill="none" stroke="#9D4EDD" stroke-width="0.5" stroke-dasharray="2 12" stroke-opacity="0.4" />
    
    <!-- Moving Nodes -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 1250 210" to="0 1250 210" dur="45s" repeatCount="indefinite" />
      <circle cx="1000" cy="210" r="4.5" fill="#9D4EDD" filter="url(#glow)"/>
      <circle cx="900" cy="210" r="2.5" fill="#9D4EDD" opacity="0.7"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 1250 210" to="360 1250 210" dur="55s" repeatCount="indefinite" />
      <circle cx="800" cy="210" r="3" fill="#9D4EDD" filter="url(#glow)"/>
      <circle cx="1000" cy="210" r="2" fill="#FFFFFF" opacity="0.5"/>
    </g>
    
    <!-- Crosshairs -->
    <path d="M 1000 205 L 1000 215 M 995 210 L 1005 210" stroke="#9D4EDD" stroke-width="1.5" stroke-opacity="0.6"/>
    <path d="M 900 205 L 900 215 M 895 210 L 905 210" stroke="#9D4EDD" stroke-width="1" stroke-opacity="0.5"/>
  </g>

  <!-- CENTER CONTENT -->
  <g text-anchor="middle">
    <!-- Name -->
    <text x="600" y="210" text-anchor="middle">
      <tspan class="name-white">RESHAM </tspan>
      <tspan fill="url(#routGradient)" class="name-gradient">ROUT</tspan>
    </text>
    
    <!-- Title -->
    <text x="600" y="265" class="title-mono">Full-Stack Software Engineer</text>
  </g>
</svg>
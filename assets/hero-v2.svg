<svg xmlns="http://www.w3.org/2000/svg" width="800" height="210" viewBox="0 0 800 210">
  <defs>
    <!-- Background Gradient: Transparent at edges -->
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1c2433" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#121822" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
    
    <!-- Fade mask for the grid so it disappears at the edges -->
    <radialGradient id="fade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="1" />
      <stop offset="60%" stop-color="white" stop-opacity="0.6" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </radialGradient>
    <mask id="fadeMask">
      <rect width="100%" height="100%" fill="url(#fade)" />
    </mask>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#202938" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #F3F6FA;
      letter-spacing: 2px;
    }
    .title {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-weight: 400;
      font-size: 15px;
      fill: #8B95A7;
      letter-spacing: 0.5px;
    }
    .metadata {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-weight: 500;
      font-size: 10px;
      fill: #4b5563;
      letter-spacing: 1.5px;
    }
    .focus-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #6b7280;
      letter-spacing: 1.5px;
    }
    .dot {
      fill: #39D98A;
      animation: pulse 2s infinite;
    }
    .focus-text {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-weight: 500;
      font-size: 13px;
      fill: #5B9CFF;
      filter: url(#textGlow);
    }
    
    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }
    @keyframes fadeCycle {
      0%, 20% { opacity: 1; transform: translateY(0); }
      25%, 95% { opacity: 0; transform: translateY(-3px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .t1 { animation: fadeCycle 12s infinite; animation-delay: 0s; }
    .t2 { animation: fadeCycle 12s infinite; animation-delay: 3s; opacity: 0; }
    .t3 { animation: fadeCycle 12s infinite; animation-delay: 6s; opacity: 0; }
    .t4 { animation: fadeCycle 12s infinite; animation-delay: 9s; opacity: 0; }
  </style>

  <!-- Background Layer -->
  <!-- We use transparent background instead of a harsh rectangle -->
  <rect width="100%" height="100%" fill="transparent" />
  
  <g mask="url(#fadeMask)">
    <rect width="100%" height="100%" fill="url(#glow)" />
    <rect width="100%" height="100%" fill="url(#grid)" />
  </g>

  <g text-anchor="middle">
    <!-- Tiny Metadata -->
    <text x="400" y="45" class="metadata">SYSTEM STATUS // ONLINE</text>

    <!-- Name and Title -->
    <text x="400" y="91" class="name">RESHAM ROUT</text>
    <text x="400" y="119" class="title">Full-Stack Software Engineer</text>
    
    <!-- Focus Section -->
    <g transform="translate(400, 155)">
      <!-- Label centered horizontally -->
      <circle cx="-75" cy="-4" r="3.5" class="dot" />
      <text x="-63" y="0" class="focus-label" text-anchor="start">CURRENTLY BUILDING</text>
      
      <!-- Animated Text perfectly stacked underneath -->
      <g transform="translate(0, 22)">
        <text x="0" y="0" class="focus-text t1" text-anchor="middle">[ API &amp; Cloud Systems ]</text>
        <text x="0" y="0" class="focus-text t2" text-anchor="middle">[ Real-Time Systems ]</text>
        <text x="0" y="0" class="focus-text t3" text-anchor="middle">[ Backend Architecture ]</text>
        <text x="0" y="0" class="focus-text t4" text-anchor="middle">[ Full-Stack Products ]</text>
      </g>
    </g>
  </g>
</svg>